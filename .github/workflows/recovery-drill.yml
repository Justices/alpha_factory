name: recovery-drill

on:
  pull_request:
  push:

jobs:
  research-recovery:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: >-
          python -m pytest
          tests/infrastructure/test_sqlalchemy_migrations.py
          tests/infrastructure/test_storage_backup.py
          tests/application/test_research_worker.py
          tests/application/test_research_rebuild.py
          -q
